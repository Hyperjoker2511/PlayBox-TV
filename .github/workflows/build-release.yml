name: Build signed release

# Builds the signed PlayBox TV release APK for Jio Store submission.
# No PC needed. Secrets required in the repo (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64      — base64 of playbox-release.keystore (never commit the file itself)
#   KEYSTORE_PASSWORD    — keystore password
#   KEY_ALIAS            — key alias, e.g. playbox
#   KEY_PASSWORD         — key password
#
# Batch 1.3: unit tests also run on every push / pull request, so a broken
# commit is caught before tagging. The signed release still only builds
# on a version tag (v*) or a manual run.

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 37 + build-tools 36.1.0
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-37" "build-tools;36.1.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.6.0

      - name: Make the Gradle wrapper executable
        # Files pushed through GitHub's web/API upload lose the +x bit.
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 37 + build-tools 36.1.0
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-37" "build-tools;36.1.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.6.0

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check signing secrets are set
        # Without this, a manual run with no secrets fails later with a
        # cryptic signing error. Fail here, with the secret's name.
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then echo "::error::KEYSTORE_PASSWORD secret is not set"; exit 1; fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then echo "::error::KEY_ALIAS secret is not set"; exit 1; fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then echo "::error::KEY_PASSWORD secret is not set"; exit 1; fi

      - name: Restore keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > playbox-release.keystore

      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<'EOF'
          storeFile=playbox-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: playbox-tv-release
          path: app/build/outputs/apk/release/*.apk
